spring.application.name=restapis

# Load .env file
spring.config.import=optional:file:.env[.properties]

#DB configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?useSSL=false}
spring.datasource.username=${DB_USER:dikshant}
spring.datasource.password=${DB_PASS:postgres}


# Hibernate
spring.jpa.hibernate.ddl-auto=validate
# Hibernate will now validate your entity mappings against the database instead of modifying the schema.
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG
spring.flyway.validate-migration-naming=true
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG